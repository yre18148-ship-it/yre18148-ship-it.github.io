name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Restore portfolio source and public assets
        run: |
          mkdir -p portfolio
          unzip -q portfolio-source-small.zip -d portfolio
          cd portfolio
          while IFS= read -r asset || [ -n "$asset" ]; do
            asset="${asset%$'\r'}"
            [ -z "$asset" ] && continue
            mkdir -p "public/$(dirname "$asset")"
            curl --fail --location --retry 3 "https://chen-wenjing-portfolio.yre18148.chatgpt.site/$asset" --output "public/$asset"
          done < asset-manifest.txt
      - name: Build portfolio
        working-directory: portfolio
        run: |
          npm install --no-audit --no-fund
          npm run build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
